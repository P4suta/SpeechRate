[project]
name = "speechrate"
version = "0.1.0"
description = "リアルタイム発話速度（モーラ/分）フィードバックアプリ — 面接・原稿読み上げ練習用"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pykakasi>=2.3.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "streamlit>=1.58.0",
    "vosk>=0.3.45",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear,
# SIM: simplify, C4: comprehensions, RUF: ruff固有
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001-003: 日本語の全角括弧・スラッシュ等を「紛らわしい文字」と誤検知するため無効化。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
